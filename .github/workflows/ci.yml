name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.x'}
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - name: Measure workspace edit assembly and LSP location batch caching
        run: go test ./internal/tools -run NoUnitTests -bench 'Benchmark(WorkspaceEditAssembly|LSPBatchLocationCache)' -benchmem -benchtime=10x -count=1
      - name: Measure first/middle/last-line position conversion allocations
        run: go test ./internal/document -run '^$' -bench '^BenchmarkLargeSourcePositionConversion$' -benchmem -benchtime=5x -count=1
      - name: Compare old/new semantic warm cursor allocations on 100k-line source
        run: go test ./internal/tools -run '^$' -bench '^BenchmarkWarmIdentifierAtPositionLargeSource$' -benchmem -benchtime=5x -count=1
      - name: Compare old/new inspect_symbol extraction on 100k-line source
        run: go test ./internal/tools -run '^$' -bench '^BenchmarkInspectSourceLargeFile$' -benchmem -benchtime=10x -count=1
      - name: Compare diagnostic batch source rereads with request-local cache
        run: go test ./internal/tools -run '^$' -bench '^BenchmarkDiagnosticsBatch(LegacyRangeReads|CachedRanges)$' -benchmem -benchtime=5x -count=1
      - name: Measure duplicate candidate-file reads in project warm-up
        run: go test ./internal/document -run NoUnitTests -bench BenchmarkWarmCandidateSync -benchmem -benchtime=100x -count=3
      - name: Compare project warm-up negative lookups with full-source scan
        run: go test ./internal/tools -run '^$' -bench '^BenchmarkProjectWarm(LegacyFullScan(Miss|Hit)|Index(ColdMiss|Miss|Hit))$' -benchmem -benchtime=100x -count=3
      - name: Check predeclared Codex evaluation gates
        run: |
          python3 -m unittest discover -s docs/benchmarks -p 'test_analyze_codex_ab.py' -v
          python3 -m unittest discover -s docs/benchmarks -p 'test_claude_trace.py' -v
          python3 -m unittest discover -s docs/benchmarks -p 'test_codex_required_runner.py' -v
          python3 -m py_compile docs/benchmarks/claude_trace.py docs/benchmarks/run_fastapi_agent_ab.py
          python3 docs/benchmarks/analyze_codex_ab.py \
            --csv docs/benchmarks/codex-fastapi-ab-2026-11-01.csv \
            --study coding-required > /tmp/codex-ab-audit.json
          python3 - <<'PYCHECK'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/codex-ab-audit.json').read_text())
          assert data['study_design']['independent_tasks'] == 3
          assert not data['qualified_product_efficiency']
          PYCHECK
      - name: Validate setup skill packaging
        run: |
          python3 - <<'PYVALID'
          import json
          from pathlib import Path
          skill = Path('skills/simple-lsp-mcp-setup/SKILL.md')
          text = skill.read_text()
          assert text.startswith('---\nname: simple-lsp-mcp-setup\n')
          assert (skill.parent / 'scripts/install-release.sh').is_file()
          assert (skill.parent / 'scripts/install-release.ps1').is_file()
          codex = json.loads(Path('.codex-plugin/plugin.json').read_text())
          claude = json.loads(Path('.claude-plugin/plugin.json').read_text())
          market = json.loads(Path('.claude-plugin/marketplace.json').read_text())
          server = json.loads(Path('.mcp.json').read_text())
          assert codex['skills'] == './skills/'
          assert server['mcpServers']['simple-lsp']['args'] == ['--auto-install-lsp']
          assert codex['version'] == claude['version'] == market['plugins'][0]['version']
          PYVALID
          sh -n skills/simple-lsp-mcp-setup/scripts/install-release.sh
      - name: Install real language servers
        run: |
          go install golang.org/x/tools/gopls@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v7
        with: {node-version: '22'}
      - name: Install TypeScript and Python language servers
        run: |
          npm install -g typescript@6 typescript-language-server pyright
          test -f "$(npm root -g)/typescript/lib/tsserver.js"
          echo "SIMPLE_LSP_TSSERVER_PATH=$(npm root -g)/typescript/lib/tsserver.js" >> "$GITHUB_ENV"
      - name: Real LSP integration tests (Go, TypeScript, Python, mixed monorepo, edits)
        env:
          SIMPLE_LSP_REAL_LSP: '1'
        run: go test ./internal/tools -run '^TestReal(LanguageServers|GoMonorepoSearchesEveryServer|WorkspaceEnumeration|ReactFastAPIMonorepoExample|LSPEditing|TypeScriptRangeFormatting|SemanticRenameAcrossLanguages|AutoDetectedLanguageServers|ImpactMultiHopGo)$' -count=1 -v -timeout=6m
  windows-uri:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.x'}
      - name: Verify native Windows LSP file URI round-trips
        run: go test ./internal/normalize ./internal/document ./internal/lsp/session
  windows-plugin-script:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows installer without execution
        shell: pwsh
        run: |
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'skills/simple-lsp-mcp-setup/scripts/install-release.ps1'), [ref]$null, [ref]$errors)
          if ($errors.Count -ne 0) { throw ($errors | Out-String) }