name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.x'}
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - name: Install real language servers
        run: |
          go install golang.org/x/tools/gopls@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install TypeScript and Python language servers
        run: |
          npm install -g typescript@6 typescript-language-server pyright
          test -f "$(npm root -g)/typescript/lib/tsserver.js"
          echo "SIMPLE_LSP_TSSERVER_PATH=$(npm root -g)/typescript/lib/tsserver.js" >> "$GITHUB_ENV"
      - name: Real LSP integration tests (Go, TypeScript, Python, mixed monorepo, rename)
        env:
          SIMPLE_LSP_REAL_LSP: '1'
        run: go test ./internal/tools -run '^TestReal(LanguageServers|GoMonorepoSearchesEveryServer|GoSemanticSlice|WorkspaceEnumeration|ReactFastAPIMonorepoExample|RenameSymbol)$' -count=1 -v -timeout=6m
