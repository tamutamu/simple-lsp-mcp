name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.x'}
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - name: Offline agent evaluation harness tests (no API calls)
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Install real language servers
        run: |
          go install golang.org/x/tools/gopls@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install TypeScript and Python language servers
        run: npm install -g typescript typescript-language-server pyright
      - name: Real LSP integration tests (Go, TypeScript, Python)
        env:
          SIMPLE_LSP_REAL_LSP: '1'
        run: go test ./internal/tools -run '^TestReal(LanguageServers|GoMonorepoSearchesEveryServer|GoSemanticSlice)$' -count=1 -v -timeout=6m
